<!doctype html>
<html lang="en">

<head>

	<meta charset="utf-8">
	<title>Spot-moi</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	<link rel="stylesheet" href="styles.css">

</head>

<body>
	<header class="w-full">
		<div class="flex items-center">
			<div class="p-2 navHover">
				<h1 class="text-3xl">Spot-moi</h1>
			</div>
			<div class="flex-1"></div>
			<div class="p-2 navHover">
				<h2 class="text-3xl"><a>Vos artistes</a></h2>
			</div>
			<div class="p-2">
				<select name="language" class="bg-black py-1 px-2 rounded-md text-whites">
					<option value="fr">Français</option>
					<option value="en">English</option>
				</select>
			</div>
		</div>
	</header>

	<main class="w-5xl mx-auto my-4">
		<h2 class="text-center text-2xl py-1">Chansons de NOM_ALBUM</h2>
		<div class="flex m-2 flex-wrap">
			<div class="basis-1/5">
				<div class="m-1 text-center p-1 artist">
					<h4>NOM_CHANSON</h4>
					<a><button class="lightButton form-control mt-1">Écouter</button></a>
				</div>
			</div>
		</div>
		<div class="flex justify-center">
			<img src="images/video.png" alt="Vidéo youtube" />
		</div>
	</main>

	<footer class="w-full">
		<div class="py-1">
			<div>
				<p class="text-center">&copy; J'ai yoink le template de l'enseignant</p>
			</div>
		</div>
	</footer>

</body>

</html>
